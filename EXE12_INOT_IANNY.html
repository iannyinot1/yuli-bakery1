<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY GALLERY</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 20px;
            background-image: url("https://i.pinimg.com/736x/dc/63/54/dc6354592fe60de131c02239aedcc758.jpg");
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
        }
        td {
            padding: 8px;
        }
        img {
            width: 200px;
            height: 200px;
            border: 3px solid #333;
            display: block;
            object-fit: cover;
        }
        a:hover img {
            opacity: 0.8;
            border-color: #0066cc;
        }
    </style>
</head>
<body>
    <h1>MY GALLERY</h1>
    <table>
        <!-- First Row -->
        <tr>
            <td>
                <a href="https://www.google.com" target="_blank">
                    <img src="https://picsum.photos/id/1015/400/400" alt="Mountains">
                </a>
            </td>
            <td>
                <a href="https://www.yahoo.com" target="_blank">
                    <img src="https://picsum.photos/id/1016/400/400" alt="Sunset">
                </a>
            </td>
            <td>
                <a href="https://www.bing.com" target="_blank">
                    <img src="https://picsum.photos/id/1018/400/400" alt="Flowers">
                </a>
            </td>
            <td>
                <a href="https://www.youtube.com" target="_blank">
                    <img src="https://picsum.photos/id/1019/400/400" alt="Ocean Waves">
                </a>
            </td>
        </tr>
        <!-- Second Row -->
        <tr>
            <td>
                <a href="https://www.microsoft.com" target="_blank">
                    <img src="https://picsum.photos/id/1020/400/400" alt="Blue Landscape">
                </a>
            </td>
            <td>
                <a href="https://www.google.com" target="_blank">
                    <img src="https://picsum.photos/id/1021/400/400" alt="Sunset Hills">
                </a>
            </td>
            <td>
                <a href="https://www.yahoo.com" target="_blank">
                    <img src="https://picsum.photos/id/1022/400/400" alt="Lotus Flowers">
                </a>
            </td>
            <td>
                <a href="https://www.bing.com" target="_blank">
                    <img src="https://picsum.photos/id/1025/400/400" alt="Blue Water">
                </a>
            </td>
        </tr>
    </table>
</body>
</html>
