<!DOCTYPE html>
<html>
<head>
    <h1 style="
    color: hotpink;
    font-family: 'Times New Roman';
    font-style: italic;
    margin-top: 100px;
">
    
</h1>
</head>

<body style="
    margin: 0;
    padding: 40px;
    background-image: url('https://i.pinimg.com/736x/af/f5/9b/aff59ba0af7147a2a8d2fda7c8e691bc.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
">

<center>

    <h1 style="
        color: hotpink;
        font-family: 'Times New Roman';
        font-style: italic;
    ">
        FONT TAG ATTRIBUTES
    </h1>

</center>

<!-- Hot Pink Box -->
<div style="
    border: 3px dashed hotpink;
    border-radius: 20px;
    padding: 25px;
    margin: 20px auto;
    max-width: 800px;
    background-color: rgba(255,255,255,0.75);
">

    <font face="Times New Roman" size="4" color="hotpink">
        This is Hot Pink Font
    </font>

    <p>
        <b>FACE:</b> Times New Roman
    </p>

    <p>
        <b>COLOR:</b> Hot Pink
    </p>

    <p>
        <b>SIZE:</b> 4
    </p>

</div>


<!-- Olive Box -->
<div style="
    border: 3px dashed olive;
    border-radius: 20px;
    padding: 25px;
    margin: 20px auto;
    max-width: 800px;
    background-color: rgba(255,255,255,0.75);
">

    <font face="Arial" size="5" color="olive">
        This is Olive Font
    </font>

    <p>
        <b>FACE:</b> Arial
    </p>

    <p>
        <b>COLOR:</b> Olive
    </p>

    <p>
        <b>SIZE:</b> 5
    </p>

</div>


<!-- Purple Box -->
<div style="
    border: 3px dashed purple;
    border-radius: 20px;
    padding: 25px;
    margin: 20px auto;
    max-width: 800px;
    background-color: rgba(255,255,255,0.75);
">

    <font face="Georgia" size="6" color="purple">
        This is Purple Font
    </font>

    <p>
        <b>FACE:</b> Georgia
    </p>

    <p>
        <b>COLOR:</b> Purple
    </p>

    <p>
        <b>SIZE:</b> 6
    </p>

</div>

</body>
</html>
