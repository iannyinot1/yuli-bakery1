<!DOCTYPE html>
<html>
<head>

    <title>Beautiful Trees</title>

    <style>

        body {
            margin: 0;
            font-family: "Times New Roman", Times, serif;

            /* Cherry Blossom Background */
            background-image: url("https://i.pinimg.com/736x/24/9d/e3/249de332cd672de28548596e406d8723.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Main Box */
        .box {
            width: 600px;
            margin: 50px auto;
            padding: 30px;

            background-color: rgba(255, 255, 255, 0.90);

            border: 4px solid #d88aaa;
            border-radius: 20px;

            box-shadow: 0 5px 20px gray;
        }

        /* Main Title */
        h1 {
            text-align: center;
            color: #8b4f68;
        }

        /* Section Titles */
        h2 {
            color: #76536a;
        }

        /* List Items */
        li {
            font-size: 20px;
            margin: 10px;
            font-weight: bold;
        }

        /* 🌸 CHERRY BLOSSOMS */
        .cherry {
            color: #e66f9b;
        }

        /* 🍁 JAPANESE MAPLE */
        .maple {
            color: #d65332;
        }

        /* 🌿 WILLOW */
        .willow {
            color: #5c8a62;
        }

        /* 💜 WISTERIA */
        .wisteria {
            color: #8b63a8;
        }

        /* Decorative Line Above Numbered List */
        .line {
            border-top: 3px solid #d88aaa;
            margin-top: 25px;
            padding-top: 15px;
        }

        /* Number Colors */
        .numbered li::marker {
            color: #8b4f68;
            font-weight: bold;
        }

        /* Letter Colors */
        .letters li::marker {
            color: #6b7f70;
            font-weight: bold;
        }

        /* Hover Effect */
        li:hover {
            transform: translateX(10px);
            transition: 0.3s;
        }

        /* Running Thank You */
        .thankyou {
            width: 100%;
            overflow: hidden;

            margin-top: 30px;

            border-top: 2px solid #d88aaa;

            padding-top: 15px;
        }

        .moving {
            color: #d14f82;

            font-size: 22px;

            font-weight: bold;

            white-space: nowrap;

            animation: move 6s linear infinite;
        }

        /* Running Animation */
        @keyframes move {

            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }

        }

    </style>

</head>

<body>

    <div class="box">

        <!-- MAIN TITLE -->

        <h1>🌸 List Tags </h1>

        <p style="text-align:center;">
            
        </p>

        <!-- LINE ABOVE NUMBERED LIST -->

        <div class="line">

            <h2>Numbered List: Types of Trees</h2>

        </div>

        <!-- NUMBERED LIST -->

        <ol class="numbered">

            <li>
                Cherry Blossoms
            </li>

            <li>
                Japanese Maple
            </li>

            <li>
                Willow
            </li>

            <li>
                Wisteria
            </li>

        </ol>

        <!-- LETTERS LIST -->

        <h2>Letters List: Colored</h2>

        <ol type="A" class="letters">

            <li class="cherry">
                Cherry Blossoms
            </li>

            <li class="maple">
                Japanese Maple
            </li>

            <li class="willow">
                Willow
            </li>

            <li class="wisteria">
                Wisteria
            </li>

        </ol>

        <!-- RUNNING THANK YOU -->

        <div class="thankyou">

            <div class="moving">
                Thank you!! 🌸🍁
            </div>

        </div>

    </div>

</body>

</html>
