<!DOCTYPE html>
<html>
<head>
    <title>Exercise 5 - Formatting Tags</title>
</head>

<body style="
    margin: 0;
    padding: 40px;
    background-image: url('https://i.pinimg.com/736x/af/f5/9b/aff59ba0af7147a2a8d2fda7c8e691bc.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Times New Roman', Times, serif;
">

    <center>
        <h1 style="
            color: hotpink;
            font-family: 'Times New Roman';
            font-style: italic;
            margin-top: 50px;
        ">
            HTML FORMATTING TAGS
        </h1>
    </center>

    <div style="
        max-width: 800px;
        margin: 30px auto;
        padding: 30px;
        border: 3px dashed hotpink;
        border-radius: 25px;
        background-color: rgba(255, 255, 255, 0.80);
        font-size: 22px;
        line-height: 1.8;
    ">

        <p style="color: hotpink;">
            <b>Bold</b>
            &nbsp; - &lt;b&gt;
        </p>

        <p style="color: olive;">
            <i>Italic</i>
            &nbsp; - &lt;i&gt;
        </p>

        <p style="color: purple;">
            <u>Underline</u>
            &nbsp; - &lt;u&gt;
        </p>

        <p style="color: magenta;">
            <strong>Strong</strong>
            &nbsp; - &lt;strong&gt;
        </p>

        <p style="color: darkpink;">
            <em>Emphasized</em>
            &nbsp; - &lt;em&gt;
        </p>

        <p style="color: pink;">
            <mark>Highlighted</mark>
            &nbsp; - &lt;mark&gt;
        </p>

        <p style="color: hotpink;">
            <small>Small Text</small>
            &nbsp; - &lt;small&gt;
        </p>

        <p style="color: olive;">
            <del>Deleted Text</del>
            &nbsp; - &lt;del&gt;
        </p>

        <p style="color: purple;">
            <ins>Inserted Text</ins>
            &nbsp; - &lt;ins&gt;
        </p>

        <p style="color: cyan;">
            H<sub>2</sub>O
            &nbsp; - Subscript
        </p>

        <p style="color: #c2185b;">
            X<sup>2</sup>
            &nbsp; - Superscript
        </p>

    </div>

    <hr>

</body>
</html>
