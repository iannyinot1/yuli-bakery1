<!DOCTYPE html>
<html>
<head>
    <title>My Favorite Quotes</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            background-image: url("https://i.pinimg.com/736x/af/f5/9b/aff59ba0af7147a2a8d2fda7c8e691bc.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: "Times New Roman", Times, serif;
        }

        h1 {
            color: hotpink;
            font-size: 40px;
            font-style: italic;
            margin-bottom: 50px;
            text-align: center;
        }

        .quote {
            padding: 25px;
            margin: 25px auto;
            width: 80%;
            background-color: rgba(255, 255, 255, 0.80);
            border: 3px dashed pink;
            border-radius: 20px;
            font-size: 20px;
            line-height: 1.6;
            box-shadow: 0 5px 15px rgba(100, 50, 50, 0.2);
        }

        .quote1 {
            color: magenta;
            text-align: left;
        }

        .quote2 {
            color: hotpink;
            text-align: center;
        }

        .quote3 {
            color: olive;
            text-align: right;
        }

        /* Cursive author names */
        .author {
            font-family: cursive;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>MY FAVORITE QUOTES</h1>

    <div class="quote quote1">
        "Happiness depends upon ourselves."
        <br>
        — <span class="author"><b>Aristotle</b></span>
    </div>

    <div class="quote quote2">
        "The future depends on what you do today."
        <br>
        — <span class="author"><i>Mahatma Gandhi</i></span>
    </div>

    <div class="quote quote3">
        "It always seems impossible until it's done."
        <br>
        — <span class="author"><u>Nelson Mandela</u></span>
    </div>

</body>
</html>
